<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BechaCant Scavenger Challenge</title>
    <style>
        :root {
            --becha-purple: #8e44ad;
            --becha-aqua: #00f2ff;
            --becha-dark: #1a1a1a;
        }

        body { 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            text-align: center; 
            background-color: var(--becha-dark);
            color: white;
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100vh;
            overflow: hidden;
        }

        /* Top Header */
        header {
            padding: 20px;
            background: linear-gradient(135deg, var(--becha-purple), var(--becha-dark));
            border-bottom: 3px solid var(--becha-aqua);
        }

        h1 { margin: 0; font-size: 1.8rem; letter-spacing: 2px; color: var(--becha-aqua); }

        /* Mission Briefing Box */
        #mission-box {
            margin: 20px;
            padding: 15px;
            border: 1px solid var(--becha-aqua);
            border-radius: 12px;
            background: rgba(0, 242, 255, 0.05);
            text-align: left;
        }

        .label { color: var(--becha-aqua); font-weight: bold; font-size: 0.8rem; text-transform: uppercase; }
        .value { margin-bottom: 10px; font-size: 1.1rem; }

        /* Compass Section */
        #compass-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #north-arrow {
            font-size: 5rem;
            transition: transform 0.1s linear;
            filter: drop-shadow(0 0 10px var(--becha-aqua));
        }

        #status-text { font-size: 2rem; font-weight: 900; margin-top: 10px; color: var(--becha-aqua); }

        /* QR & Start Buttons */
        .btn {
            margin: 20px;
            padding: 20px;
            background: var(--becha-aqua);
            color: var(--becha-dark);
            border: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.2rem;
            cursor: pointer;
            text-transform: uppercase;
        }

        #qr-section { display: none; padding: 20px; }
        .hot { color: #ff4d4d !important; }
    </style>
</head>
<body>

    <header>
        <h1>BECHACANT</h1>
    </header>

    <div id="mission-box">
        <div class="label">Objective</div>
        <div class="value" id="obj-text">Navigate to the Hidden Landmark</div>
        
        <div class="label">Reward</div>
        <div class="value">50 Becha-Points + Badge</div>
        
        <div class="label">Current Distance</div>
        <div class="value" id="distance">--- meters</div>
    </div>

    <div id="compass-container">
        <div id="north-arrow">🧭</div>
        <div id="status-text">LOCKED</div>
    </div>

    <div id="qr-section">
        <button class="btn" onclick="simulateQRScan()">SCAN QR TO FINISH</button>
    </div>

    <button id="start-btn" class="btn" onclick="startHunt()">Initialize Scavenger</button>

    <script>
        // TARGET: Set to your test spot
        const target = { lat: 41.9778, lng: -91.6656 }; 
        let lastDistance = null;

        function startHunt() {
            document.getElementById('start-btn').style.display = 'none';
            document.getElementById('status-text').innerText = "SEARCHING...";

            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission();
            }

            navigator.geolocation.watchPosition(updatePosition, handleError, {
                enableHighAccuracy: true,
                maximumAge: 1000
            });

            window.addEventListener('deviceorientationabsolute', (e) => {
                // The arrow rotates counter to your phone to always stay North
                const north = e.alpha || 0;
                document.getElementById('north-arrow').style.transform = `rotate(${-north}deg)`;
            }, true);
        }

        function updatePosition(position) {
            const dist = haversine(position.coords.latitude, position.coords.longitude, target.lat, target.lng);
            const distEl = document.getElementById('distance');
            const statusEl = document.getElementById('status-text');

            distEl.innerText = `${Math.round(dist)} meters`;

            if (dist <= 20) {
                statusEl.innerText = "ARRIVED!";
                document.getElementById('qr-section').style.display = "block";
            } else if (lastDistance && dist < lastDistance) {
                statusEl.innerText = "HOTTER";
                statusEl.className = "hot";
                if (navigator.vibrate) navigator.vibrate(100);
            } else {
                statusEl.innerText = "COLDER";
                statusEl.className = "";
            }
            lastDistance = dist;
        }

        function haversine(lat1, lon1, lat2, lon2) {
            const R = 6371000;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function simulateQRScan() {
            alert("SUCCESS! Reward Claimed.");
            location.reload();
        }

        function handleError(err) { alert("GPS Error: " + err.message); }
    </script>
</body>
</html>
