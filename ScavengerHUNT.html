<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BechaCant Scavenger Pro</title>
    <style>
        :root { --purple: #8e44ad; --aqua: #00f2ff; --dark: #121212; --grey: #2a2a2a; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--dark); color: white; margin: 0; display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; }
        
        header { padding: 15px; background: linear-gradient(to right, var(--purple), var(--dark)); border-bottom: 2px solid var(--aqua); text-align: center; }
        h1 { margin: 0; font-size: 1.5rem; color: var(--aqua); letter-spacing: 3px; }

        #mission-card { margin: 15px; padding: 15px; border-radius: 15px; background: rgba(255,255,255,0.05); border: 1px solid rgba(0,242,255,0.3); }
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.85rem; }
        .label { color: var(--aqua); font-weight: bold; }

        /* Symmetrical Compass Hub */
        #game-view { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        #compass-outer { 
            position: relative; width: 220px; height: 220px; 
            border: 1px solid rgba(0, 242, 255, 0.3); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
        }
        #compass-ring {
            position: absolute; width: 100%; height: 100%;
            transition: transform 0.1s linear;
        }
        .direction { 
            position: absolute; font-weight: 900; font-size: 1.4rem; color: var(--aqua);
            width: 30px; height: 30px; display: flex; align-items: center; justify-content: center;
            transition: transform 0.1s linear; /* Counter-rotation for letters */
        }
        /* Positioning directions on the ring */
        .n { top: 10px; left: calc(50% - 15px); }
        .s { bottom: 10px; left: calc(50% - 15px); }
        .e { right: 10px; top: calc(50% - 15px); }
        .w { left: 10px; top: calc(50% - 15px); }

        /* Symmetrical Crosshair Center */
        #center-hub {
            width: 60px; height: 60px; border: 2px solid var(--aqua); border-radius: 50%;
            position: relative; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.4);
        }
        .crosshair-v { position: absolute; width: 2px; height: 20px; background: var(--aqua); }
        .crosshair-h { position: absolute; width: 20px; height: 2px; background: var(--aqua); }

        #distance-big { font-size: 2.2rem; font-weight: 900; margin: 15px 0; color: var(--aqua); text-shadow: 0 0 10px rgba(0,242,255,0.5); }

        /* Leaderboard Section */
        #leaderboard-section { background: #1a1a1a; padding: 15px; border-radius: 25px 25px 0 0; border-top: 2px solid var(--purple); }
        .controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        select { background: var(--grey); color: white; border: 1px solid var(--aqua); padding: 5px; border-radius: 5px; font-size: 0.75rem; }
        
        .header-row { display: grid; grid-template-columns: 25px 1.2fr 1fr 1.1fr 60px; font-size: 0.65rem; color: var(--aqua); font-weight: bold; padding: 8px; border-bottom: 1px solid var(--grey); text-align: center; }
        .entry { display: grid; grid-template-columns: 25px 1.2fr 1fr 1.1fr 60px; align-items: center; padding: 10px 5px; border-bottom: 1px solid #222; font-size: 0.8rem; text-align: center; }
        
        .name { text-align: left; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .befriend-btn { background: transparent; border: 1px solid var(--aqua); color: var(--aqua); border-radius: 4px; padding: 3px; font-size: 0.6rem; cursor: pointer; width: 90%; margin: 0 auto;}
        .points { font-family: monospace; color: var(--aqua); text-align: right; }

        .btn { width: 85%; padding: 15px; border-radius: 50px; border: none; font-weight: bold; cursor: pointer; text-transform: uppercase; margin: 10px auto; display: block;}
        #start-btn { background: var(--aqua); color: var(--dark); box-shadow: 0 4px 15px rgba(0,242,255,0.3); }
        #qr-btn { display: none; background: #2ecc71; color: white; }
    </style>
</head>
<body>

    <header><h1>BECHACANT</h1></header>

    <div id="mission-card">
        <div class="stat-row"><span class="label">OBJECTIVE</span><span>Safe Place Foundation (Usually "Hidden")</span></div>
        <div class="stat-row"><span class="label">REWARD</span><span>50 Points</span></div>
        <div class="stat-row"><span class="label">STATUS</span><span id="move-status">LOCKED</span></div>
    </div>

    <div id="game-view">
        <div id="compass-outer">
            <div id="compass-ring">
                <div class="direction n">N</div>
                <div class="direction e">E</div>
                <div class="direction s">S</div>
                <div class="direction w">W</div>
            </div>
            <div id="center-hub">
                <div class="crosshair-v"></div>
                <div class="crosshair-h"></div>
            </div>
        </div>
        <div id="distance-big">-- m</div>
        <button id="start-btn" class="btn" onclick="startChallenge()">Initialize Scavenger</button>
        <button id="qr-btn" class="btn" onclick="simulateWin()">Scan QR Code</button>
    </div>

    <div id="leaderboard-section">
        <div class="controls">
            <span style="font-size: 0.9rem; font-weight: bold;">LEADERBOARD</span>
            <select id="geo-filter" onchange="updateLeaderboard()">
                <option value="city">Cedar Rapids [City]</option>
                <option value="county">Linn [County]</option>
                <option value="state">Iowa [State]</option>
            </select>
        </div>
        
        <div class="header-row">
            <span>#</span><span style="text-align:left">USER</span><span>MILEAGE</span><span>SOCIAL</span><span style="text-align:right">PTS</span>
        </div>
        <div id="leaderboard-list"></div>
    </div>

    <script>
        const target = { lat: 41.9772, lng: -91.6611 };
        const data = {
            city: [["CerealKiller", 1250, 4.2], ["RiverKing", 1100, 12.8], ["Quaker88", 950, 2.1], ["BCC_Founder", 800, 1.2], ["GrantK", 750, 0.8]],
            county: [["MarionMaster", 2100, 15.6], ["HiawathaHero", 1850, 9.4], ["CerealKiller", 1250, 4.2], ["LinnLurker", 1200, 22.1], ["ElyExplorer", 1000, 3.5]],
            state: [["DM_Insure", 5000, 48.2], ["Hawkeye1", 4200, 31.5], ["CyclonePw", 3900, 28.9], ["MarionMaster", 2100, 15.6], ["IC_Intel", 1950, 11.2]]
        };

        function updateLeaderboard() {
            const filter = document.getElementById('geo-filter').value;
            const list = document.getElementById('leaderboard-list');
            list.innerHTML = data[filter].map((user, i) => `
                <div class="entry">
                    <span class="rank">${i+1}</span>
                    <span class="name">${user[0]}</span>
                    <span style="color:#aaa">${user[2]} MI</span>
                    <span class="social"><button class="befriend-btn" onclick="alert('Request Sent!')">+ BEFRIEND</button></span>
                    <span class="points">${user[1]}</span>
                </div>
            `).join('');
        }

        function startChallenge() {
            document.getElementById('start-btn').style.display = 'none';
            document.getElementById('move-status').innerText = "SEARCHING";
            
            navigator.geolocation.watchPosition(pos => {
                const dist = haversine(pos.coords.latitude, pos.coords.longitude, target.lat, target.lng);
                document.getElementById('distance-big').innerText = Math.round(dist) + "m";
                if (dist < 20) {
                    document.getElementById('move-status').innerText = "ARRIVED";
                    document.getElementById('qr-btn').style.display = 'block';
                }
            }, null, { enableHighAccuracy: true });

            window.addEventListener('deviceorientationabsolute', e => {
                const north = e.alpha || 0;
                // Rotate the ring
                document.getElementById('compass-ring').style.transform = `rotate(${-north}deg)`;
                // Counter-rotate the individual letters so they stay upright
                const letters = document.querySelectorAll('.direction');
                letters.forEach(l => {
                    l.style.transform = `rotate(${north}deg)`;
                });
            }, true);
        }

        function haversine(lat1, lon1, lat2, lon2) {
            const R = 6371000;
            const dLat = (lat2-lat1)*Math.PI/180;
            const dLon = (lon2-lon1)*Math.PI/180;
            const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function simulateWin() { alert("Verified!"); location.reload(); }
        updateLeaderboard();
    </script>
</body>
</html>
