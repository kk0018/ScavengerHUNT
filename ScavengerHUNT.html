<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BechaCant Scavenger Pro</title>
    <style>
        :root { --purple: #8e44ad; --aqua: #00f2ff; --dark: #121212; --grey: #2a2a2a; }
        
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: var(--dark); color: white; margin: 0; 
            display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; 
        }
        
        header { padding: 15px; background: linear-gradient(to right, var(--purple), var(--dark)); border-bottom: 2px solid var(--aqua); text-align: center; }
        h1 { margin: 0; font-size: 1.5rem; color: var(--aqua); letter-spacing: 3px; }

        /* Registration Overlay */
        #reg-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(18, 18, 18, 0.98); display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100; text-align: center; padding: 20px; box-sizing: border-box;
        }
        #reg-box { border: 2px solid var(--aqua); padding: 30px; border-radius: 20px; background: var(--dark); width: 100%; max-width: 320px; box-shadow: 0 0 30px rgba(0, 242, 255, 0.2); }
        input { width: 100%; padding: 12px; margin: 20px 0; border-radius: 8px; border: 1px solid var(--grey); background: #333; color: white; font-size: 1rem; text-align: center; }

        /* Main Content Layout */
        #main-container { display: flex; flex-direction: row; flex-grow: 1; padding: 10px; align-items: flex-start; gap: 10px; }

        /* Compass Section (Left) */
        #left-col { flex: 1.2; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #compass-outer { position: relative; width: 180px; height: 180px; border: 1px solid rgba(0, 242, 255, 0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        #compass-ring { position: absolute; width: 100%; height: 100%; transition: transform 0.1s linear; }
        .direction { position: absolute; font-weight: 900; font-size: 1.1rem; color: var(--aqua); width: 25px; height: 25px; display: flex; align-items: center; justify-content: center; }
        .n { top: 5px; left: calc(50% - 12.5px); } .s { bottom: 5px; left: calc(50% - 12.5px); } .e { right: 5px; top: calc(50% - 12.5px); } .w { left: 5px; top: calc(50% - 12.5px); }
        #center-hub { width: 60px; height: 60px; border-radius: 50%; background: var(--dark); border: 2px solid var(--aqua); display: flex; align-items: center; justify-content: center; z-index: 5; position: relative; }
        .plus-v { position: absolute; width: 3px; height: 20px; background: var(--aqua); }
        .plus-h { position: absolute; width: 20px; height: 3px; background: var(--aqua); }

        /* Hints Section (Right) */
        #right-col { flex: 0.8; background: rgba(255,255,255,0.05); border: 1px solid var(--grey); border-radius: 12px; padding: 10px; min-height: 250px; }
        .hint-item { border-bottom: 1px solid #333; padding: 10px 0; font-size: 0.85rem; transition: 0.3s; }
        .hint-label { color: var(--aqua); font-weight: bold; font-size: 0.7rem; text-transform: uppercase; }
        .hint-text { margin-top: 5px; color: #fff; }
        .locked { filter: blur(4px); opacity: 0.5; color: #666; }
        .timer { float: right; font-family: monospace; color: var(--purple); font-weight: bold; }

        #distance-big { font-size: 1.8rem; font-weight: 900; margin: 10px 0; color: var(--aqua); }

        /* Leaderboard */
        #leaderboard-section { background: #1a1a1a; padding: 15px; border-radius: 25px 25px 0 0; border-top: 2px solid var(--purple); }
        .controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        select { background: var(--grey); color: white; border: 1px solid var(--aqua); padding: 5px; border-radius: 5px; font-size: 0.75rem; }
        .header-row { display: grid; grid-template-columns: 25px 1.2fr 1fr 1.1fr 60px; font-size: 0.65rem; color: var(--aqua); font-weight: bold; padding: 8px; border-bottom: 1px solid var(--grey); text-align: center; }
        .entry { display: grid; grid-template-columns: 25px 1.2fr 1fr 1.1fr 60px; align-items: center; padding: 10px 5px; border-bottom: 1px solid #222; font-size: 0.8rem; text-align: center; }
        .befriend-btn { background: transparent; border: 1px solid var(--aqua); color: var(--aqua); border-radius: 4px; padding: 3px; font-size: 0.6rem; cursor: pointer; width: 90%; display: block; margin: 0 auto;}

        .btn { width: 90%; padding: 12px; border-radius: 50px; border: none; font-weight: bold; cursor: pointer; text-transform: uppercase; margin: 10px auto; display: block; }
        #init-btn { background: var(--aqua); color: var(--dark); }
        #main-start-btn { background: var(--aqua); color: var(--dark); }
        #qr-btn { display: none; background: #2ecc71; color: white; }

        footer { padding: 15px; text-align: center; margin-top: auto; }
        .reset-link { background: none; border: 1px solid #444; color: #666; font-size: 0.7rem; padding: 8px 12px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="reg-overlay">
        <div id="reg-box">
            <h2 style="color:var(--aqua); margin:0;">JOIN CHALLENGE</h2>
            <input type="text" id="username-input" placeholder="Enter Name" maxlength="12">
            <button class="btn" id="init-btn" onclick="registerUser()">INITIALIZE</button>
        </div>
    </div>

    <header><h1>BECHACANT</h1></header>

    <div id="main-container">
        <div id="left-col">
            <div id="compass-outer">
                <div id="compass-ring">
                    <div class="direction n">N</div><div class="direction e">E</div>
                    <div class="direction s">S</div><div class="direction w">W</div>
                </div>
                <div id="center-hub"><div class="plus-v"></div><div class="plus-h"></div></div>
            </div>
            <div id="distance-big">-- m</div>
            <button id="main-start-btn" class="btn" onclick="startChallenge()">Start Hunt</button>
            <button id="qr-btn" class="btn" onclick="simulateWin()">Scan QR Code</button>
        </div>

        <div id="right-col">
            <h3 style="margin-top:0; font-size:0.9rem; color:var(--aqua);">MISSION INTEL</h3>
            <div class="hint-item">
                <div class="hint-label">Hint #1</div>
                <div class="hint-text" id="hint-1">Addiction Recovery</div>
            </div>
            <div class="hint-item">
                <div class="hint-label">Hint #2 <span id="timer-2" class="timer">30s</span></div>
                <div class="hint-text locked" id="hint-2">Men Only</div>
            </div>
            <div class="hint-item">
                <div class="hint-label">Hint #3 <span id="timer-3" class="timer">60s</span></div>
                <div class="hint-text locked" id="hint-3">Safely Downtown</div>
            </div>
        </div>
    </div>

    <div id="leaderboard-section">
        <div class="controls">
            <span style="font-size: 0.9rem; font-weight: bold;">LEADERBOARD</span>
            <select id="geo-filter" onchange="updateLeaderboard()">
                <option value="city">Cedar Rapids [City]</option>
                <option value="county">Linn [County]</option>
                <option value="state">Iowa [State]</option>
            </select>
        </div>
        <div class="header-row"><span>#</span><span style="text-align:left">USER</span><span>MILEAGE</span><span>SOCIAL</span><span style="text-align:right">PTS</span></div>
        <div id="leaderboard-list"></div>
    </div>

    <footer><button class="reset-link" onclick="resetTestData()">[Reset Account (Test)]</button></footer>

    <script>
        const target = { lat: 41.9772, lng: -91.6611 };
        let currentUser = localStorage.getItem('bechaUser') || null;
        let hintInterval;

        window.onload = () => {
            if (currentUser) {
                document.getElementById('reg-overlay').style.display = 'none';
                updateLeaderboard();
                startHintTimers();
            }
        };

        function registerUser() {
            const val = document.getElementById('username-input').value.trim();
            if (val.length < 2) return alert("Please enter a username.");
            currentUser = val;
            localStorage.setItem('bechaUser', val);
            document.getElementById('reg-overlay').style.display = 'none';
            updateLeaderboard();
            startHintTimers();
        }

        function startHintTimers() {
            let seconds = 0;
            hintInterval = setInterval(() => {
                seconds++;
                
                // Hint #2 Logic (30 Seconds)
                let time2 = 30 - seconds;
                if (time2 > 0) {
                    document.getElementById('timer-2').innerText = time2 + "s";
                } else {
                    document.getElementById('timer-2').style.display = 'none';
                    document.getElementById('hint-2').classList.remove('locked');
                }

                // Hint #3 Logic (60 Seconds)
                let time3 = 60 - seconds;
                if (time3 > 0) {
                    document.getElementById('timer-3').innerText = time3 + "s";
                } else {
                    document.getElementById('timer-3').style.display = 'none';
                    document.getElementById('hint-3').classList.remove('locked');
                }

                if (seconds >= 60) clearInterval(hintInterval);
            }, 1000);
        }

        function updateLeaderboard() {
            const filter = document.getElementById('geo-filter').value;
            const list = document.getElementById('leaderboard-list');
            let baseData = [["CerealKiller", 1250, 4.2], ["RiverKing", 1100, 12.8], ["Quaker88", 950, 2.1], ["GrantK", 750, 0.8]];
            if (currentUser && !baseData.find(u => u[0] === currentUser)) {
                baseData.pop(); baseData.push([currentUser, 0, 0.0]);
            }
            baseData.sort((a,b) => b[1]-a[1]);
            list.innerHTML = baseData.map((u, i) => `
                <div class="entry" style="${u[0] === currentUser ? 'background:rgba(0,242,255,0.1)' : ''}">
                    <span class="rank">${i+1}</span><span class="name" style="${u[0] === currentUser ? 'color:var(--aqua)' : ''}">${u[0]}</span>
                    <span>${u[2]} MI</span><span class="social"><button class="befriend-btn">${u[0] === currentUser ? 'YOU' : '+ BEFRIEND'}</button></span><span style="color:var(--aqua)">${u[1]}</span>
                </div>
            `).join('');
        }

        function startChallenge() {
            document.getElementById('main-start-btn').style.display = 'none';
            if (typeof DeviceOrientationEvent.requestPermission === 'function') DeviceOrientationEvent.requestPermission();
            navigator.geolocation.watchPosition(pos => {
                const dist = haversine(pos.coords.latitude, pos.coords.longitude, target.lat, target.lng);
                document.getElementById('distance-big').innerText = Math.round(dist) + "m";
                if (dist < 25) document.getElementById('qr-btn').style.display = 'block';
            }, null, { enableHighAccuracy: true });
            window.addEventListener('deviceorientationabsolute', e => {
                const north = e.alpha || 0;
                document.getElementById('compass-ring').style.transform = `rotate(${-north}deg)`;
                document.querySelectorAll('.direction').forEach(l => l.style.transform = `rotate(${north}deg)`);
            }, true);
        }

        function haversine(lat1, lon1, lat2, lon2) {
            const R = 6371000;
            const dLat = (lat2-lat1)*Math.PI/180; const dLon = (lon2-lon1)*Math.PI/180;
            const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function resetTestData() {
            if(confirm("Wipe local username and mileage?")) { localStorage.removeItem('bechaUser'); location.reload(); }
        }

        function simulateWin() { alert("Verification Success!"); location.reload(); }
    </script>
</body>
</html>
